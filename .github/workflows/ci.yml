name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run already in flight for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    # The tests connect over unix domain sockets, as miracle's IPC does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test --reporter expanded

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # Catches the things that only surface at publish time: a malformed
      # pubspec, a missing changelog entry, an oversized archive.
      - name: Validate the package
        run: dart pub publish --dry-run
