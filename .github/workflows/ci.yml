name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run already in flight for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    # The tests connect over unix domain sockets, as miracle's IPC does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test --reporter expanded

  bindings:
    name: Bindings up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # ffigen parses the C header with libclang.
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install dependencies
        run: dart pub get

      # Pinned so that a new ffigen release cannot silently change the output.
      - name: Install ffigen
        run: dart pub global activate ffigen 21.0.0

      # Regenerating from the commit pinned in third_party/miracle/VERSION must
      # be a no-op. A diff here means either the vendored header or the
      # generated bindings were edited by hand.
      - name: Regenerate the bindings
        run: dart run tool/generate_bindings.dart

      - name: Check for drift
        run: git diff --exit-code third_party/miracle lib/src/config/bindings.g.dart

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # Catches the things that only surface at publish time: a malformed
      # pubspec, a missing changelog entry, an oversized archive.
      - name: Validate the package
        run: dart pub publish --dry-run
